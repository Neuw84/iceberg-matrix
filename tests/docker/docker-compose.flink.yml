# Dockerized Flink cluster used by tests/flink_feature_tests.py.
#
# Runs a standalone Flink 2.3 cluster (one JobManager, one TaskManager) from an
# image that already carries the Iceberg Flink runtime jars (see flink/Dockerfile).
# The harness drives it with the SQL client inside the JobManager container:
#
#   docker compose -f docker-compose.flink.yml exec -T jobmanager \
#     /opt/flink/bin/sql-client.sh embedded -f /work/<script>.sql
#
# Catalog connectivity: the cluster talks to the Polaris REST catalog and MinIO
# from tests/docker/docker-compose.polaris.yml over the host's own IP (published
# ports) rather than over a shared compose network. That is required, not just
# convenient -- Polaris returns the catalog's S3 endpoint on loadTable, and that
# endpoint is recorded as the host IP so that both host-side engines and
# containers resolve the same address. See the note at the top of
# docker-compose.polaris.yml.
#
# Bring it up with tests/docker/start-flink.sh (which detects the host IP), and
# tear it down with tests/docker/stop-flink.sh.

name: iceberg-promise-flink

services:
  jobmanager:
    build:
      context: ./flink
      args:
        FLINK_IMAGE: ${FLINK_IMAGE:-flink:2.3.0-scala_2.12-java17}
        ICEBERG_VERSION: ${ICEBERG_VERSION:-1.11.0}
        ICEBERG_FLINK_MAJOR: ${ICEBERG_FLINK_MAJOR:-2.1}
    image: iceberg-promise-flink:${FLINK_VERSION:-2.3.0}-iceberg${ICEBERG_VERSION:-1.11.0}
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      # rest.address is what the in-container SQL client dials; rest.bind-address
      # keeps the published port reachable from the host.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.bind-address: 0.0.0.0
        # Explicit, small footprints: the suite's jobs are tiny, and without
        # these Flink's defaults (1600m + 1728m) plus the SQL-client JVMs that
        # run inside this container can exceed the Docker VM's memory and get
        # the taskmanager OOM-killed (exit 137) mid-run.
        jobmanager.memory.process.size: 1024m
        env.java.opts.client: -Xmx640m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        execution.checkpointing.interval: 5s
        execution.checkpointing.min-pause: 1s
        table.exec.sink.upsert-materialize: NONE
    volumes:
      - ./flink-work:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s

  taskmanager:
    image: iceberg-promise-flink:${FLINK_VERSION:-2.3.0}-iceberg${ICEBERG_VERSION:-1.11.0}
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        execution.checkpointing.interval: 5s
        execution.checkpointing.min-pause: 1s
        table.exec.sink.upsert-materialize: NONE
    volumes:
      - ./flink-work:/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
