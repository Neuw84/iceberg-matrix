AWSTemplateFormatVersion: '2010-09-09'
Description: >
  OIDC trust and IAM roles for iceberg-matrix platform tests on EMR Serverless.
  Creates a CI role assumed by GitHub Actions via OIDC (scoped to a single
  GitHub environment) and a job execution role assumed by EMR Serverless.
  Deploy with: --capabilities CAPABILITY_NAMED_IAM

Parameters:
  GitHubRepo:
    Type: String
    Default: Neuw84/iceberg-matrix
    Description: owner/repo allowed to assume the CI role
  DatabricksAccountId:
    Type: String
    Default: ''
    Description: >
      Databricks *account* id (the UUID from the account console), used as the
      sts:ExternalId when Unity Catalog assumes the storage-credential role.
      Leave empty to skip creating the Databricks storage role.
  EnvironmentName:
    Type: String
    Default: aws-live
    Description: >
      GitHub environment name. Must match the environment used by the workflow
      job: the OIDC subject claim is scoped to it, so tokens minted from any
      other context (pull requests, other branches) cannot assume the role.
  DatabricksEnvironmentName:
    Type: String
    Default: databricks-live
    Description: >
      Second GitHub environment allowed to assume the CI role, used by the
      Databricks workflow. It exists so the Databricks credentials do not have to
      live in the AWS environment: secrets are per-environment, so anything gated
      on EnvironmentName can read every secret stored there, and the AWS platform
      tests have no business being able to read a Databricks token. The Databricks
      job still needs this role for the read-only S3 layout inspection, which is
      why it is a second allowed subject rather than a second role. Set it equal
      to EnvironmentName to collapse them back into one.
  SnowflakeEnvironmentName:
    Type: String
    Default: snowflake-live
    Description: >
      Third GitHub environment allowed to assume the CI role, used by the
      Snowflake workflow. Same rationale as DatabricksEnvironmentName: the
      Snowflake credentials live only on their own environment, and the Snowflake
      job assumes this role solely for the read-only S3 layout inspection that
      proves each managed table is genuine Iceberg. Set it equal to
      EnvironmentName to collapse them back into one.
  SnowflakeExternalId:
    Type: String
    Default: ''
    Description: >
      The sts:ExternalId that Snowflake uses when its external volume assumes
      the storage role, i.e. STORAGE_AWS_EXTERNAL_ID from the STORAGE_LOCATION_1
      row of DESC EXTERNAL VOLUME. This value does not exist until the external
      volume has been created, and the volume references the role by ARN, so the
      role must exist first -- a two-pass setup (see infra/aws/README.MD section
      10). Leave empty on the first deploy: the role is created trusting only its
      own account with a placeholder that matches nothing, so it cannot yet be
      assumed. After DESC EXTERNAL VOLUME, redeploy with this AND
      SnowflakeIamUserArn set to the real values. Both must be supplied together
      on the second pass. NOTE: use the VOLUME's external id, not a storage
      integration's -- managed Iceberg authenticates through the volume, and a
      storage integration generates a *different* external id that will not match.
  SnowflakeIamUserArn:
    Type: String
    Default: ''
    Description: >
      The Snowflake-owned IAM user ARN that assumes the storage role, i.e.
      STORAGE_AWS_IAM_USER_ARN from the STORAGE_LOCATION_1 row of
      DESC EXTERNAL VOLUME. Like SnowflakeExternalId this is generated by the
      external volume and supplied on the second-pass deploy. Ignored unless
      SnowflakeExternalId is also set.
  DataBucket:
    Type: String
    Description: Existing S3 bucket for warehouse data, job scripts, logs and reports
  TableBucketArn:
    Type: String
    Description: Existing S3 Tables bucket ARN, e.g. arn:aws:s3tables:eu-west-1:123456789012:bucket/my-tables
  ResourcePrefix:
    Type: String
    Default: icebergmatrix
    Description: Prefix for created Glue databases and S3 Tables namespaces; IAM is scoped to it
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: >
      Leave empty to create the GitHub OIDC provider. If your account already
      has one, paste its ARN here (a second provider for the same URL fails).
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
    Description: Monthly cost budget for the account
  BudgetNotificationEmail:
    Type: String
    Default: ''
    Description: Optional email for budget alerts at 80% of the limit
  RedshiftBaseCapacity:
    Type: Number
    Default: 8
    Description: >
      Redshift Serverless base capacity in RPUs. 8 is the global minimum; 4 is
      only accepted in the regions listed in the 4-RPU launch announcements,
      which do not include us-east-1. Serverless bills per RPU-second while a
      query runs and nothing while idle, so this is a ceiling on burst cost
      rather than a running charge.
  RedshiftSubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Three or more subnets in different AZs for the Redshift Serverless
      workgroup. Leave empty to let Redshift choose from the default VPC, but
      note that not every AZ offers Serverless, so passing subnets explicitly is
      the reliable option.
  RedshiftSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Security groups for the workgroup. Leave empty to use the VPC default.
      Nothing needs inbound access: the tests reach Redshift over the Data API,
      which is an AWS API call rather than a database connection.

Conditions:
  CreateDatabricksRole: !Not [!Equals [!Ref DatabricksAccountId, '']]
  # The Snowflake role is created as soon as the caller opts in by giving it a
  # GitHub environment name. It deliberately does NOT depend on
  # SnowflakeExternalId being set: the role has to exist first so that Snowflake
  # can generate the external id (chicken-and-egg), so the first-pass deploy
  # creates the role with an unusable placeholder external id and a later deploy
  # supplies the real one.
  CreateSnowflakeRole: !Not [!Equals [!Ref SnowflakeEnvironmentName, '']]
  # Whether Snowflake has handed back its external id yet. Until it has, the
  # trust condition is pinned to a sentinel that matches nothing, so the role
  # exists but cannot be assumed by anyone.
  HasSnowflakeExternalId: !Not [!Equals [!Ref SnowflakeExternalId, '']]
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, '']
  HasBudgetEmail: !Not [!Equals [!Ref BudgetNotificationEmail, '']]
  # CommaDelimitedList cannot be compared directly, so join it back to a string.
  HasRedshiftSubnets: !Not [!Equals [!Join ['', !Ref RedshiftSubnetIds], '']]
  HasRedshiftSecurityGroups: !Not [!Equals [!Join ['', !Ref RedshiftSecurityGroupIds], '']]

Resources:

  # ---------------------------------------------------------------------------
  # GitHub Actions OIDC provider. Both thumbprints are GitHub's published
  # intermediate CA fingerprints; IAM validates the chain itself, but the
  # property is expected here.
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ---------------------------------------------------------------------------
  # Job execution role: assumed by EMR Serverless, not by GitHub. This is the
  # identity that actually reads and writes table data.
  # ---------------------------------------------------------------------------
  # Shared job execution role for every engine under test. The resource name
  # still says "emr-job" because renaming it would replace the role and break the
  # AWS_EMR_JOB_ROLE_ARN environment secret; the permissions are engine-neutral.
  EmrJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-emr-job'
      Description: Execution role for iceberg-matrix platform test jobs (EMR Serverless and Glue)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: emr-serverless.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
          # Glue ETL assumes this role to run the job script. Deliberately no
          # aws:SourceAccount condition: Glue does not reliably populate it on
          # the AssumeRole call for job execution roles, and a condition that
          # never matches fails the job with an AccessDenied that looks like a
          # permissions bug elsewhere. The real control is on the other side --
          # the CI role may only pass this role to glue.amazonaws.com.
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Policies:

        - PolicyName: s3-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'

        # Glue writes job output to CloudWatch Logs rather than to S3 the way EMR
        # Serverless does, and a job whose role cannot write them fails to start.
        - PolicyName: cloudwatch-logs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:AssociateKmsKey
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'

        # Glue Data Catalog as the Iceberg catalog for the s3buckets mode.
        - PolicyName: glue-catalog-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # GetCatalog is needed on the account's root catalog, not only
                  # on the federated one: resolving a federated catalog such as
                  # s3tablescatalog walks the hierarchy from the root down, so
                  # the s3tables mode fails every test with AccessDeniedException
                  # on glue:GetCatalog for the bare :catalog resource without it.
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                  - glue:DeleteDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ResourcePrefix}*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ResourcePrefix}*/*'
                  # DeleteDatabase cascades to user-defined functions, so Glue
                  # authorises it against this resource type as well. Without it
                  # every namespace drop fails with AccessDeniedException on
                  # glue:DeleteDatabase for userDefinedFunction/<db>/*.
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/${ResourcePrefix}*/*'

        # S3 Tables as the Iceberg catalog for the s3tables mode. Deliberately
        # broad on the one table bucket for the first runs; narrow this once you
        # have seen which calls the writes actually make.
        - PolicyName: s3tables-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3tables:*
                Resource:
                  - !Ref TableBucketArn
                  - !Sub '${TableBucketArn}/*'

        # The s3tables mode reaches S3 Tables through the Glue Data Catalog
        # federation, not the native S3TablesCatalog client: EMR Serverless has
        # no route to the s3tables endpoint, so the catalog is addressed as
        # glue.id=<account>:s3tablescatalog/<bucket> and every metadata call goes
        # to Glue instead.
        #
        # Federated catalogs sit in their own ARN hierarchy, with the catalog and
        # bucket as extra leading segments -- database/s3tablescatalog/<bucket>/<ns>
        # rather than database/<ns>. The default-catalog statement above does not
        # match those, so they need their own entry, and glue:GetCatalog is only
        # required on this path.
        - PolicyName: glue-s3tables-federation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                  - glue:DeleteDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog'
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog/${TableBucketName}'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/s3tablescatalog/${TableBucketName}/${ResourcePrefix}*'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/s3tablescatalog/${TableBucketName}/${ResourcePrefix}*/*'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
                  # As in the default catalog, DeleteDatabase is also authorised
                  # against userDefinedFunction, here under the federated path.
                  # Without it DROP NAMESPACE fails with AccessDeniedException on
                  # userDefinedFunction/s3tablescatalog/<bucket>/<ns>/*.
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/s3tablescatalog/${TableBucketName}/${ResourcePrefix}*/*'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
              # Vending temporary data credentials for federated catalog tables
              # goes through Lake Formation, so the caller needs GetDataAccess
              # even when the catalog is governed by IAM rather than by Lake
              # Formation grants. It takes no resource qualifier.
              - Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: '*'

  # ---------------------------------------------------------------------------
  # Redshift role: assumed by Redshift itself, not by GitHub. Redshift is the
  # only engine here that both reads and writes Iceberg tables through its own
  # service identity, so this role needs catalog write access rather than the
  # read-only access a query engine would need.
  # ---------------------------------------------------------------------------
  RedshiftRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-redshift'
      Description: Attached to the Redshift Serverless namespace for Iceberg reads and writes
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Both principals: provisioned Redshift uses redshift.amazonaws.com and
          # Serverless uses redshift-serverless.amazonaws.com. Trusting both keeps
          # the role usable if this ever moves to a provisioned cluster.
          - Effect: Allow
            Principal:
              Service:
                - redshift.amazonaws.com
                - redshift-serverless.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:

        # Writes need DeleteObject as well as Put: MERGE stages intermediate
        # files under the table location and garbage-collects them at the end of
        # the statement, and it fails outright if that delete is denied.
        - PolicyName: s3-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'

        # Redshift creates, alters and drops Iceberg tables in the Data Catalog,
        # so unlike a pure query engine it needs the write verbs too.
        - PolicyName: glue-catalog-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                  - glue:DeleteDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ResourcePrefix}*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ResourcePrefix}*/*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/${ResourcePrefix}*/*'

        # S3 Tables mode. Redshift addresses a table bucket as the federated
        # catalog "<bucket>@s3tablescatalog", so it needs both the s3tables API
        # and the federated Glue hierarchy, exactly as the Spark engines do.
        - PolicyName: s3tables-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3tables:*
                Resource:
                  - !Ref TableBucketArn
                  - !Sub '${TableBucketArn}/*'

        - PolicyName: glue-s3tables-federation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetCatalog
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                  - glue:DeleteDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog'
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog/${TableBucketName}'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/s3tablescatalog/${TableBucketName}/${ResourcePrefix}*'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/s3tablescatalog/${TableBucketName}/${ResourcePrefix}*/*'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
                  - !Sub
                    - 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/s3tablescatalog/${TableBucketName}/${ResourcePrefix}*/*'
                    - TableBucketName: !Select [1, !Split ['/', !Ref TableBucketArn]]
              - Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: '*'

  # ---------------------------------------------------------------------------
  # Databricks storage-credential role: assumed by Unity Catalog (from the
  # Databricks-owned AWS account) to read and write managed Iceberg table data
  # under the databricks/ prefix of the data bucket. This is what lets the
  # Databricks platform tests put real Iceberg tables on our bucket where the
  # suite can inspect the storage layout.
  #
  # Two trust statements are required by Unity Catalog:
  #   1. The Databricks UC master role, with the Databricks account id as
  #      sts:ExternalId (confused-deputy protection).
  #   2. The role itself ("self-assuming role", a UC requirement). CloudFormation
  #      cannot reference a role ARN inside its own trust policy, so the
  #      statement trusts the account root narrowed by aws:PrincipalArn to this
  #      role's fixed name — semantically identical to trusting the role ARN.
  # ---------------------------------------------------------------------------
  DatabricksStorageRole:
    Type: AWS::IAM::Role
    Condition: CreateDatabricksRole
    Properties:
      RoleName: !Sub '${ResourcePrefix}-databricks-storage'
      Description: Assumed by Databricks Unity Catalog for iceberg-matrix managed table storage
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # 414351767826 is the Databricks production AWS account; the UC master
          # role inside it performs every storage-credential assumption.
          - Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::414351767826:role/unity-catalog-prod-UCMasterRole-14S5ZJVKOTYTL'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref DatabricksAccountId
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                'aws:PrincipalArn': !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}-databricks-storage'
              StringEquals:
                'sts:ExternalId': !Ref DatabricksAccountId
      Policies:
        # Object access is scoped to the databricks/ prefix, so Unity Catalog can
        # never read or write the other engines' warehouses, scripts or reports on
        # the same bucket.
        #
        # The bucket-level actions are deliberately NOT narrowed by an s3:prefix
        # condition, which is what an earlier version of this template tried:
        #
        #   - s3:GetBucketLocation carries no s3:prefix context key at all, so a
        #     condition on it can never match and the call is always denied.
        #   - Unity Catalog's own validation lists the location as it was written
        #     (the CREATE EXTERNAL LOCATION error names ".../databricks", with no
        #     trailing slash), so StringLike 'databricks/*' misses it, and an
        #     unprefixed ListObjectsV2 has nothing to match either.
        #
        # Both together produce "PERMISSION_DENIED: AWS IAM role does not have
        # READ permissions on url s3://<bucket>/databricks ... AccessDeniedException
        # error from cloud storage provider" while the role is assumed correctly,
        # which sends you looking at the trust policy instead of the permissions.
        # Databricks documents the bucket ARN with no condition and refers anyone
        # wanting a tighter policy to their account team.
        #
        # The residual exposure is key enumeration: the credential can list names
        # anywhere in the bucket but can only open objects under databricks/.
        - PolicyName: s3-databricks-prefix
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  # Unity Catalog writes table data with multipart uploads and
                  # cleans up its own aborted parts.
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/databricks/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'
        # Unity Catalog requires the role to be able to assume itself.
        - PolicyName: self-assume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ResourcePrefix}-databricks-storage'

  # ---------------------------------------------------------------------------
  # Snowflake storage role: assumed by Snowflake's own AWS account when an
  # external volume reads and writes managed Iceberg table data under the
  # snowflake/ prefix of the data bucket. This is the analogue of the Databricks
  # storage role, and it exists for the same reason: managed Iceberg tables land
  # on a bucket we control, so the test suite can inspect the storage layout and
  # prove each table is genuine Iceberg (metadata/*.metadata.json present).
  #
  # It differs from the Databricks role in one structural way: the external id.
  # Databricks uses a value you already know (the account UUID), so its trust
  # policy is complete on the first deploy. Snowflake *generates* the external id
  # (STORAGE_AWS_EXTERNAL_ID) inside the external volume, and the volume
  # references this role by ARN, so the role must exist first. That is a genuine
  # chicken-and-egg, resolved with a two-pass deploy:
  #
  #   1. Deploy with SnowflakeExternalId empty. The role is created but its trust
  #      condition pins sts:ExternalId to a sentinel ("PENDING_SNOWFLAKE_...")
  #      that Snowflake will never send, so the role cannot yet be assumed.
  #   2. CREATE EXTERNAL VOLUME in Snowflake pointing at this role's ARN, then
  #      DESC EXTERNAL VOLUME to read STORAGE_AWS_IAM_USER_ARN and
  #      STORAGE_AWS_EXTERNAL_ID from the STORAGE_LOCATION_1 row. Redeploy with
  #      SnowflakeExternalId set to the latter; the trust now admits exactly this
  #      volume. Do NOT use a storage integration's external id -- managed
  #      Iceberg authenticates through the volume, and an integration generates a
  #      different external id that fails the assume with sts:AssumeRole denied.
  #
  # The principal is Snowflake's IAM user (STORAGE_AWS_IAM_USER_ARN), which is an
  # IAM user in a Snowflake-owned account, unique to your Snowflake account. We
  # cannot know it at authoring time, so the trust trusts the account root
  # narrowed by aws:PrincipalArn is not possible here (it is a cross-account
  # principal); instead we trust the account-scoped ARN pattern Snowflake
  # documents and rely on the external-id condition as the confused-deputy guard.
  # See infra/aws/README.MD section 10.
  # ---------------------------------------------------------------------------
  SnowflakeStorageRole:
    Type: AWS::IAM::Role
    Condition: CreateSnowflakeRole
    Properties:
      RoleName: !Sub '${ResourcePrefix}-snowflake-storage'
      Description: Assumed by Snowflake's external volume for iceberg-matrix managed table storage
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Snowflake's external volume assumes this role from a
          # Snowflake-owned AWS account. The exact IAM user ARN
          # (STORAGE_AWS_IAM_USER_ARN) is generated per Snowflake account and is
          # supplied on the second-pass deploy; until then the principal is
          # pinned to this account's root, which combined with the sentinel
          # external id below means nothing can assume the role. Once the real
          # STORAGE_AWS_EXTERNAL_ID is provided, the external-id condition is the
          # confused-deputy control that scopes the trust to your external volume.
          - Effect: Allow
            Principal:
              AWS: !If
                - HasSnowflakeExternalId
                - !Ref SnowflakeIamUserArn
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'sts:ExternalId': !If
                  - HasSnowflakeExternalId
                  - !Ref SnowflakeExternalId
                  # A sentinel Snowflake will never send: the role exists but is
                  # unusable until the real external id is wired in on pass two.
                  - 'PENDING_SNOWFLAKE_EXTERNAL_ID'
      Policies:
        # Object access is scoped to the snowflake/ prefix, so the volume
        # can never read or write the other engines' warehouses, scripts or
        # reports on the same bucket. The bucket-level actions are left
        # unconditioned (no s3:prefix condition) for the same reasons documented
        # on the Databricks role: GetBucketLocation carries no s3:prefix key, and
        # a scoped ListBucket breaks external-volume validation. The residual
        # exposure is key enumeration bucket-wide; objects can only be opened
        # under snowflake/.
        - PolicyName: s3-snowflake-prefix
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/snowflake/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'
                # Snowflake only lists under the prefixes it owns. Unlike the
                # Databricks role this condition is safe to keep, because
                # Snowflake issues ListBucket with an s3:prefix of snowflake/ and
                # does not rely on an unprefixed bucket-location probe for
                # external-volume validation.
                Condition:
                  StringLike:
                    's3:prefix':
                      - 'snowflake/*'

  # ---------------------------------------------------------------------------
  # Redshift Serverless namespace and workgroup.
  #
  # ManageAdminPassword hands the admin credentials to Secrets Manager instead of
  # this template, so no password is ever a stack parameter, a stack output or a
  # GitHub secret. The tests authenticate to the Data API with that secret's ARN.
  # ---------------------------------------------------------------------------
  RedshiftNamespace:
    Type: AWS::RedshiftServerless::Namespace
    Properties:
      NamespaceName: !Sub '${ResourcePrefix}-ns'
      DbName: dev
      AdminUsername: icebergmatrix_admin
      ManageAdminPassword: true
      DefaultIamRoleArn: !GetAtt RedshiftRole.Arn
      IamRoles:
        - !GetAtt RedshiftRole.Arn

  RedshiftWorkgroup:
    Type: AWS::RedshiftServerless::Workgroup
    Properties:
      WorkgroupName: !Sub '${ResourcePrefix}-wg'
      NamespaceName: !Ref RedshiftNamespace
      BaseCapacity: !Ref RedshiftBaseCapacity
      # No public endpoint. The Data API is reached as an AWS API call, so
      # nothing has to connect to the database over the network.
      PubliclyAccessible: false
      SubnetIds: !If [HasRedshiftSubnets, !Ref RedshiftSubnetIds, !Ref 'AWS::NoValue']
      SecurityGroupIds: !If
        - HasRedshiftSecurityGroups
        - !Ref RedshiftSecurityGroupIds
        - !Ref 'AWS::NoValue'

  # ---------------------------------------------------------------------------
  # CI role: assumed by GitHub Actions via OIDC. Drives EMR Serverless and
  # cleans up afterwards. It never touches table data directly.
  # ---------------------------------------------------------------------------
  CiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-ci'
      Description: Assumed by GitHub Actions to run iceberg-matrix platform tests
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              # Environment-scoped: this is the enforcement point. Two subjects
              # are allowed, not a wildcard -- the repo is still pinned and any
              # other context (pull requests, other branches, other environments)
              # still cannot assume the role. ForAnyValue is the right operator
              # because sub carries a single value that has to match one of the
              # listed environments; StringEquals against a list would require it
              # to equal both at once and would never match.
              ForAnyValue:StringEquals:
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubRepo}:environment:${EnvironmentName}'
                  - !Sub 'repo:${GitHubRepo}:environment:${DatabricksEnvironmentName}'
                  - !Sub 'repo:${GitHubRepo}:environment:${SnowflakeEnvironmentName}'
      Policies:

        - PolicyName: drive-emr-serverless
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CreateApplication and List* cannot be scoped to a resource.
              - Effect: Allow
                Action:
                  - emr-serverless:CreateApplication
                  - emr-serverless:ListApplications
                Resource: '*'
              - Effect: Allow
                Action:
                  - emr-serverless:GetApplication
                  - emr-serverless:StartApplication
                  - emr-serverless:StopApplication
                  - emr-serverless:DeleteApplication
                  - emr-serverless:TagResource
                  - emr-serverless:UntagResource
                  - emr-serverless:StartJobRun
                  - emr-serverless:GetJobRun
                  - emr-serverless:ListJobRuns
                  - emr-serverless:CancelJobRun
                Resource:
                  - !Sub 'arn:${AWS::Partition}:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/*'

              # Manage the ephemeral Glue ETL job definition for a run. Scoped to
              # the resource prefix so this cannot touch anyone else's jobs.
              # CreateJob and the List/Get pair cannot be resource-scoped.
              - Effect: Allow
                Action:
                  - glue:CreateJob
                  - glue:ListJobs
                Resource: '*'
              - Effect: Allow
                Action:
                  - glue:GetJob
                  - glue:GetJobs
                  - glue:UpdateJob
                  - glue:DeleteJob
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                  - glue:TagResource
                  - glue:UntagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${ResourcePrefix}*'

              # Hand the job role to the two engines that run jobs, and nothing
              # else. This condition is what keeps the Glue trust statement above
              # safe without an aws:SourceAccount check on the trust side.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EmrJobRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService':
                      - emr-serverless.amazonaws.com
                      - glue.amazonaws.com

              # The first CreateApplication in an account has to create the
              # service-linked role AWSServiceRoleForAmazonEMRServerless, which
              # otherwise fails with "Access denied when calling
              # CreateServiceLinkedRole". The condition means this can only ever
              # create that one role, for that one service.
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ops.emr-serverless.amazonaws.com/AWSServiceRoleForAmazonEMRServerless'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName': ops.emr-serverless.amazonaws.com

        # Redshift is driven entirely through the Data API: statements are
        # submitted as AWS API calls, so there is no database connection, no
        # password and no network path to arrange. The workgroup itself is
        # long-lived stack infrastructure, so the CI role only uses it -- it
        # cannot create or delete the workgroup or the namespace.
        - PolicyName: drive-redshift
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The Data API actions take no resource qualifier: authorisation is
              # on the workgroup and the credentials, both scoped below.
              - Effect: Allow
                Action:
                  - redshift-data:ExecuteStatement
                  - redshift-data:BatchExecuteStatement
                  - redshift-data:DescribeStatement
                  - redshift-data:GetStatementResult
                  - redshift-data:CancelStatement
                  - redshift-data:ListStatements
                Resource: '*'
              - Effect: Allow
                Action:
                  - redshift-serverless:GetWorkgroup
                  - redshift-serverless:GetNamespace
                  - redshift-serverless:ListWorkgroups
                  - redshift-serverless:ListNamespaces
                  - redshift-serverless:GetCredentials
                Resource:
                  - !Sub 'arn:${AWS::Partition}:redshift-serverless:${AWS::Region}:${AWS::AccountId}:workgroup/*'
                  - !Sub 'arn:${AWS::Partition}:redshift-serverless:${AWS::Region}:${AWS::AccountId}:namespace/*'
              # Read the Secrets Manager secret Redshift created for the admin
              # user, so the Data API can authenticate without a stored password.
              #
              # Scoped by name rather than by exact ARN: CloudFormation does not
              # expose the secret ARN as an attribute of the namespace resource
              # (GetAtt Namespace.AdminPasswordSecretArn is rejected as not a
              # readonly property), and Secrets Manager appends a random suffix
              # to every ARN in any case. The "redshift!" prefix is reserved for
              # secrets the Redshift service creates, so this cannot widen to a
              # secret of ours.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:redshift!*'

        - PolicyName: s3-scripts-and-reports
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DataBucket}'

        # Teardown of catalog objects the job created. Read + delete only:
        # the CI role must not be able to create tables.
        - PolicyName: teardown-catalog-objects
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:DeleteTable
                  - glue:DeleteDatabase
                Resource:
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${ResourcePrefix}*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${ResourcePrefix}*/*'
                  - !Sub 'arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:userDefinedFunction/${ResourcePrefix}*/*'
              - Effect: Allow
                Action:
                  - s3tables:GetTableBucket
                  - s3tables:ListNamespaces
                  - s3tables:GetNamespace
                  - s3tables:ListTables
                  - s3tables:GetTable
                  - s3tables:GetTableMetadataLocation
                  - s3tables:DeleteTable
                  - s3tables:DeleteNamespace
                Resource:
                  - !Ref TableBucketArn
                  - !Sub '${TableBucketArn}/*'

  # ---------------------------------------------------------------------------
  # Cost guard. Not a limit, only an alarm: AWS budgets cannot stop spend.
  # ---------------------------------------------------------------------------
  CostGuard:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${ResourcePrefix}-ci'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers: !If
        - HasBudgetEmail
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetNotificationEmail
        - !Ref AWS::NoValue

Outputs:
  CiRoleArn:
    Description: Set as the AWS_CI_ROLE_ARN environment secret in GitHub
    Value: !GetAtt CiRole.Arn
  EmrJobRoleArn:
    Description: Set as the AWS_EMR_JOB_ROLE_ARN environment secret in GitHub
    Value: !GetAtt EmrJobRole.Arn
  DataBucketName:
    Description: Set as the AWS_DATA_BUCKET environment secret in GitHub
    Value: !Ref DataBucket
  TableBucketArnOut:
    Description: Set as the AWS_TABLE_BUCKET_ARN environment secret in GitHub
    Value: !Ref TableBucketArn
  ResourcePrefixOut:
    Description: Glue databases and S3 Tables namespaces must start with this
    Value: !Ref ResourcePrefix
  RedshiftWorkgroupName:
    Description: Set as the AWS_REDSHIFT_WORKGROUP environment secret in GitHub
    Value: !Ref RedshiftWorkgroup
  RedshiftNamespaceName:
    Description: Redshift Serverless namespace backing the workgroup
    Value: !Ref RedshiftNamespace
  RedshiftAdminSecretHint:
    Description: >
      Redshift creates and manages the admin secret; its ARN is not a
      CloudFormation attribute of the namespace, so look it up at runtime with
      redshift-serverless get-namespace --namespace-name <name> and read
      adminPasswordSecretArn. Nothing here ever holds the password.
    Value: !Sub 'aws redshift-serverless get-namespace --namespace-name ${ResourcePrefix}-ns --query namespace.adminPasswordSecretArn'
  RedshiftRoleArn:
    Description: IAM role attached to the namespace for Iceberg reads and writes
    Value: !GetAtt RedshiftRole.Arn
  DatabricksStorageRoleArn:
    Condition: CreateDatabricksRole
    Description: >
      Use as the IAM role ARN when creating the Unity Catalog storage
      credential in the Databricks account console
    Value: !GetAtt DatabricksStorageRole.Arn
  SnowflakeStorageRoleArn:
    Condition: CreateSnowflakeRole
    Description: >
      Use as STORAGE_AWS_ROLE_ARN when creating the Snowflake external volume
      (CREATE EXTERNAL VOLUME ... STORAGE_AWS_ROLE_ARN=...). After
      DESC EXTERNAL VOLUME, redeploy this stack with SnowflakeExternalId and
      SnowflakeIamUserArn set so the role's trust policy admits the volume.
    Value: !GetAtt SnowflakeStorageRole.Arn
  RedshiftDatabase:
    Description: Database name inside the namespace
    Value: dev