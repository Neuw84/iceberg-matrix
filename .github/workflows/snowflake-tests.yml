name: Snowflake Platform Tests

# Runs the Iceberg feature suite against a live Snowflake account and compares
# the results with the matrix cells, the same way the Databricks workflow does
# for a SQL warehouse.
#
# The matrix cells for the snowflake platform were measured on a Snowflake
# Enterprise account in us-east-1 with Iceberg v3 GA; the report records the
# Snowflake version of each run next to that reference so a discrepancy can be
# told apart from Snowflake having shipped a feature since.
#
# Deliberately NOT triggered by pull_request: this spends real money on a
# personal Snowflake account and assumes an AWS IAM role for the S3 layout
# inspection. Dispatch only, gated by the snowflake-live environment (required
# reviewer).
#
# It has its own environment rather than sharing aws-live, for the same reason
# the Databricks workflow does: environment secrets are readable by any job that
# gates on that environment, so the Snowflake credentials live only on
# snowflake-live and the AWS platform tests cannot read them. The S3 inspection
# still assumes the AWS CI role, so that role's trust policy allows this
# environment as a third OIDC subject (SnowflakeEnvironmentName in
# infra/aws/aws.yaml) -- the repo is still pinned and no other context can
# assume it.
#
# The suite creates Snowflake-managed Iceberg tables (CATALOG = 'SNOWFLAKE') on
# an external volume whose storage lives under s3://<AWS_DATA_BUCKET>/snowflake/,
# then inspects the storage layout with boto3 to prove the tables are genuine
# Iceberg (metadata/*.metadata.json present).
#
# One-time prerequisites (see infra/aws/README.MD section 10):
#   - the two-pass storage-integration setup (role <-> integration external id)
#   - an external volume over s3://<AWS_DATA_BUCKET>/snowflake/
#   - a database:  CREATE DATABASE ICEBERGMATRIX
#   - a virtual warehouse the user/role can use
#
# Environment secrets, all on snowflake-live (this environment owns its own copy
# rather than inheriting aws-live's):
#   SNOWFLAKE_ACCOUNT          account identifier, e.g. ab12345.us-east-1
#   SNOWFLAKE_USER             login name
#   SNOWFLAKE_PASSWORD         password auth, OR:
#   SNOWFLAKE_PRIVATE_KEY      PEM private key for key-pair auth
#   SNOWFLAKE_PRIVATE_KEY_PASSPHRASE  optional passphrase for the key
#   SNOWFLAKE_ROLE             role to use (optional)
#   SNOWFLAKE_WAREHOUSE        virtual warehouse for compute
#   SNOWFLAKE_EXTERNAL_VOLUME  external volume backing managed tables
#   AWS_CI_ROLE_ARN            CiRoleArn stack output, for the S3 inspection
#   AWS_REGION                 region of the data bucket
#   AWS_DATA_BUCKET            bucket holding the external volume storage

on:
  workflow_dispatch:
    inputs:
      database:
        description: Snowflake database holding the run schemas
        type: string
        default: ICEBERGMATRIX
      storage-mode:
        description: >
          Iceberg storage under test: "external" (our S3 bucket through the
          external volume, with S3 layout inspection) or "managed"
          (Snowflake-provided storage, SQL-only evidence). Matches the matrix
          UI toggle; each mode compares against its own data file.
        type: choice
        options:
          - external
          - managed
        default: external
      base-location:
        description: Base directory on the external volume (external mode only)
        type: string
        default: managed
      only:
        description: >
          Comma-separated test-name filters to run a subset (e.g.
          "variant,lineage"). Empty runs the full suite.
        type: string
        default: ''
      dry-run:
        description: Verify connectivity (Snowflake + OIDC) and stop
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Shared database and external volume: never let two runs overlap.
  group: snowflake-live
  cancel-in-progress: false

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: snowflake-live
    permissions:
      id-token: write
      contents: read
    env:
      RUN_TAG: icebergmatrix-${{ github.run_id }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_EXTERNAL_VOLUME: ${{ secrets.SNOWFLAKE_EXTERNAL_VOLUME }}
      SNOWFLAKE_DATABASE: ${{ inputs.database }}
      SNOWFLAKE_STORAGE_MODE: ${{ inputs.storage-mode }}
      SNOWFLAKE_BASE_LOCATION: ${{ inputs.base-location }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DATA_BUCKET: ${{ secrets.AWS_DATA_BUCKET }}
      RESOURCE_PREFIX: icebergmatrix

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # Read-only S3 access for the layout inspection; the tables themselves are
      # written by Snowflake through its own storage integration.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ${{ github.run_id }}

      - name: Verify connectivity
        run: |
          aws sts get-caller-identity
          uv run --with snowflake-connector-python --with cryptography python - <<'EOF'
          import os
          import snowflake.connector

          kwargs = {
              "account": os.environ["SNOWFLAKE_ACCOUNT"],
              "user": os.environ["SNOWFLAKE_USER"],
              "warehouse": os.environ["SNOWFLAKE_WAREHOUSE"],
          }
          if os.environ.get("SNOWFLAKE_ROLE"):
              kwargs["role"] = os.environ["SNOWFLAKE_ROLE"]
          pk = os.environ.get("SNOWFLAKE_PRIVATE_KEY")
          if pk:
              from cryptography.hazmat.backends import default_backend
              from cryptography.hazmat.primitives import serialization
              passphrase = os.environ.get("SNOWFLAKE_PRIVATE_KEY_PASSPHRASE") or None
              key = serialization.load_pem_private_key(
                  pk.encode(),
                  password=passphrase.encode() if passphrase else None,
                  backend=default_backend(),
              )
              kwargs["private_key"] = key.private_bytes(
                  encoding=serialization.Encoding.DER,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption(),
              )
          else:
              kwargs["password"] = os.environ["SNOWFLAKE_PASSWORD"]

          with snowflake.connector.connect(**kwargs) as conn, conn.cursor() as c:
              c.execute("SELECT CURRENT_USER(), CURRENT_VERSION()")
              user, version = c.fetchone()
              print(f"Connected as {user}, Snowflake {version}")
          EOF

      - name: Stop here on dry run
        if: inputs.dry-run
        run: 'echo "Dry run complete: Snowflake connectivity and OIDC verified, nothing created."'

      # No continue-on-error: the suite exits non-zero on discrepancies or
      # errors, and that should fail the job. Teardown still runs (always()).
      - name: Run feature suite on Snowflake
        if: '!inputs.dry-run'
        env:
          SNOWFLAKE_ONLY: ${{ inputs.only }}
        run: >
          uv run --with snowflake-connector-python --with cryptography --with boto3
          python tests/snowflake_feature_tests.py

      - name: Tear down billable resources
        if: always() && !inputs.dry-run
        run: >
          uv run --with snowflake-connector-python --with cryptography
          python tests/snowflake_teardown.py

      - name: Upload reports
        if: always() && !inputs.dry-run
        uses: actions/upload-artifact@v7
        with:
          name: snowflake-platform-test-report
          path: test-reports/
          if-no-files-found: warn
