name: Spark Iceberg Feature Tests (V2 + V3)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  SPARK_VERSION: "4.1"
  ICEBERG_VERSION: "1.11.0"

jobs:
  iceberg-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/requirements.txt

      - name: Install Python dependencies
        run: |
          uv pip install --system -r tests/requirements.txt

      - name: Download Iceberg Spark runtime + AWS bundle JARs
        run: |
          BASE="https://repo1.maven.org/maven2/org/apache/iceberg"
          RUNTIME_JAR="iceberg-spark-runtime-${SPARK_VERSION}_2.13-${ICEBERG_VERSION}.jar"
          AWS_JAR="iceberg-aws-bundle-${ICEBERG_VERSION}.jar"
          echo "Downloading ${RUNTIME_JAR}"
          curl -fSL -o "${RUNTIME_JAR}" \
            "${BASE}/iceberg-spark-runtime-${SPARK_VERSION}_2.13/${ICEBERG_VERSION}/${RUNTIME_JAR}"
          echo "Downloading ${AWS_JAR}"
          curl -fSL -o "${AWS_JAR}" \
            "${BASE}/iceberg-aws-bundle/${ICEBERG_VERSION}/${AWS_JAR}"
          echo "ICEBERG_JAR=$(pwd)/${RUNTIME_JAR},$(pwd)/${AWS_JAR}" >> $GITHUB_ENV

      - name: Start Iceberg REST catalog (Apache iceberg-rest-fixture + MinIO)
        run: |
          set -euo pipefail
          docker network create iceberg-net

          # MinIO S3-compatible object storage for the table data files.
          docker run -d --name minio --network iceberg-net -p 9000:9000 \
            -e MINIO_ROOT_USER=admin -e MINIO_ROOT_PASSWORD=password \
            minio/minio:latest server /data
          sleep 5

          # Create the warehouse bucket.
          docker run --rm --network iceberg-net --entrypoint /bin/sh minio/mc:latest -c \
            "mc alias set m http://minio:9000 admin password && mc mb -p m/warehouse"

          # Apache Iceberg REST catalog backed by the MinIO warehouse.
          docker run -d --name iceberg-rest --network iceberg-net -p 8181:8181 \
            -e CATALOG_WAREHOUSE=s3://warehouse/ \
            -e CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO \
            -e CATALOG_S3_ENDPOINT=http://minio:9000 \
            -e CATALOG_S3_PATH__STYLE__ACCESS=true \
            -e AWS_ACCESS_KEY_ID=admin -e AWS_SECRET_ACCESS_KEY=password -e AWS_REGION=us-east-1 \
            apache/iceberg-rest-fixture:latest

          # Wait for the catalog to answer its config endpoint.
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8181/v1/config?warehouse=s3://warehouse/" >/dev/null 2>&1; then
              echo "Iceberg REST catalog is ready"; break
            fi
            sleep 2
          done

      - name: Run Iceberg feature tests
        env:
          ICEBERG_REST_URI: http://127.0.0.1:8181
          ICEBERG_REST_WAREHOUSE: s3://warehouse/
          ICEBERG_S3_ENDPOINT: http://127.0.0.1:9000
          ICEBERG_S3_KEY_ID: admin
          ICEBERG_S3_SECRET: password
          ICEBERG_S3_REGION: us-east-1
        run: |
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export REPORT_DIR="${GITHUB_WORKSPACE}/test-reports"
          export ICEBERG_WAREHOUSE="${RUNNER_TEMP}/iceberg-warehouse"
          export SPARK_VERSION="${SPARK_VERSION}"
          export ICEBERG_VERSION="${ICEBERG_VERSION}"
          python tests/iceberg_feature_tests.py
        continue-on-error: true

      - name: Tear down Iceberg REST catalog
        if: always()
        run: docker rm -f iceberg-rest minio 2>/dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-test-report
          path: test-reports/
          retention-days: 30

      - name: Post PR comment with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'test-reports/iceberg-test-report.md';
            if (!fs.existsSync(reportPath)) {
              console.log('No report found, skipping comment');
              return;
            }
            const body = fs.readFileSync(reportPath, 'utf8');
            const truncated = body.length > 60000 ? body.substring(0, 60000) + '\n\n... (truncated)' : body;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '<!-- iceberg-test-report -->';
            const existing = comments.find(c => c.body.includes(marker));
            const commentBody = `${marker}\n${truncated}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
