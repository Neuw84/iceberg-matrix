name: AWS Platform Tests

# Runs the Iceberg feature suite against managed AWS engines and compares the
# results with the matrix cells, the same way the OSS engine workflows do.
#
# Deliberately NOT triggered by pull_request: this spends real money and assumes
# an IAM role. Dispatch only, gated by the aws-live environment (required
# reviewer), and the OIDC trust policy is scoped to that environment so a token
# minted anywhere else cannot assume the role.
#
# EMR Serverless, Glue and Redshift Serverless are implemented. The engine input
# exists so Athena can be added without restructuring; it fails fast until then.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to test
        type: choice
        default: emr-serverless
        options:
          - emr-serverless
          - glue
          - redshift
          - athena       # not implemented
      redshift-fixtures:
        description: >
          Build the Spark fixtures first (engine redshift only). Redshift cannot
          create format-version 3 tables, branches or tags, so without these the
          affected cells can only report "cannot write" and must leave "cannot
          read" unmeasured. Costs one short EMR Serverless job per mode.
        type: boolean
        default: true
      modes:
        description: Storage mode(s)
        type: choice
        default: both
        options: [both, s3buckets, s3tables]
      release-label:
        description: EMR release label (engine emr-serverless only)
        type: string
        default: emr-spark-8.0.0
      glue-version:
        description: >
          Glue version (engine glue only). This pins both Spark and Iceberg, so
          it decides which V3 features are reachable at all: 6.0 ships Spark
          4.1.1 with Iceberg 1.11.0, 5.1 ships Spark 3.5.6 with Iceberg 1.10.0,
          5.0 ships 1.7.1 and 4.0 ships 1.0.0. The Spark half matters as much as
          the Iceberg half -- VARIANT needs Spark 4, so it is unreachable on 5.1
          however new Iceberg is. A V3 run below 5.1 mostly measures the absence
          of V3.
        type: choice
        default: '6.0'
        options: ['6.0', '5.1', '5.0', '4.0']
      iceberg-jar-path:
        description: >
          Optional in-image Iceberg jar for spark.jars. Empty is correct on EMR
          Serverless, where Iceberg is already on the classpath; only set this
          for a release that needs an explicit jar.
        type: string
        default: ''
      probe:
        description: Run only the diagnostic job (reports the image layout)
        type: boolean
        default: false
      dry-run:
        description: Assume the role and stop (proves OIDC without spending)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Shared AWS resources: never let two runs overlap.
  group: aws-live
  cancel-in-progress: false

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-live
    permissions:
      id-token: write
      contents: read
    env:
      RUN_TAG: icebergmatrix-${{ github.run_id }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DATA_BUCKET: ${{ secrets.AWS_DATA_BUCKET }}
      AWS_EMR_JOB_ROLE_ARN: ${{ secrets.AWS_EMR_JOB_ROLE_ARN }}
      AWS_TABLE_BUCKET_ARN: ${{ secrets.AWS_TABLE_BUCKET_ARN }}
      REDSHIFT_ROLE_ARN: ${{ secrets.AWS_REDSHIFT_ROLE_ARN }}
      RESOURCE_PREFIX: icebergmatrix
      ENGINE: emr

    steps:
      - name: Reject unimplemented engines
        if: inputs.engine == 'athena'
        run: |
          echo "::error::'${{ inputs.engine }}' is not implemented yet; emr-serverless, glue and redshift are."
          exit 1

      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ${{ github.run_id }}

      - name: Verify assumed identity
        run: aws sts get-caller-identity

      - name: Stop here on dry run
        if: inputs.dry-run
        run: 'echo "Dry run complete: OIDC trust and environment gate verified, nothing provisioned."'

      # No continue-on-error: the driver exits non-zero when a job run fails or
      # a report contains discrepancies or errors, and that should fail the job.
      # Teardown still runs because it is guarded with always().
      - name: Run feature suite on EMR Serverless
        if: '!inputs.dry-run && inputs.engine == ''emr-serverless'''
        env:
          MODES: ${{ inputs.modes }}
          EMR_RELEASE_LABEL: ${{ inputs.release-label }}
          ICEBERG_JAR_PATH: ${{ inputs.iceberg-jar-path }}
          PROBE: ${{ inputs.probe }}
        run: uv run --with boto3 python tests/aws/run_emr_serverless.py

      - name: Run feature suite on Glue
        if: '!inputs.dry-run && inputs.engine == ''glue'''
        env:
          MODES: ${{ inputs.modes }}
          GLUE_VERSION: ${{ inputs.glue-version }}
        run: uv run --with boto3 python tests/aws/run_glue.py

      # Separate step from the suite so a fixture failure is attributable, and so
      # the suite still runs without them: the cells that need a fixture then
      # report read support as unmeasured rather than guessing.
      - name: Build Spark fixtures for Redshift
        id: redshift-fixtures
        if: '!inputs.dry-run && inputs.engine == ''redshift'' && inputs.redshift-fixtures'
        env:
          MODES: ${{ inputs.modes }}
          EMR_RELEASE_LABEL: ${{ inputs.release-label }}
        run: uv run --with boto3 python tests/aws/run_redshift_fixtures.py
        continue-on-error: true

      - name: Run feature suite on Redshift Serverless
        if: '!inputs.dry-run && inputs.engine == ''redshift'''
        env:
          MODES: ${{ inputs.modes }}
          # Only claim the fixtures exist if the job that builds them succeeded.
          # A stale name here would make every fixture-backed cell report a
          # missing table instead of an honest "not measured".
          REDSHIFT_FIXTURE_DB: ${{ steps.redshift-fixtures.outcome == 'success' && 'icebergmatrix_rsfix' || '' }}
        run: uv run --with boto3 python tests/aws/run_redshift.py

      # ENGINE tells teardown which S3 prefix to clear; the Glue and S3 Tables
      # cleanup is prefix-scoped and runs regardless.
      #
      # Redshift maps to 'emr' deliberately: its fixtures are built by an EMR
      # Serverless job and therefore live under emr/, including the EMR
      # application that has to be deleted. The suite's own redshift/ prefix is
      # swept unconditionally by teardown.py.
      - name: Tear down billable resources
        if: always() && !inputs.dry-run
        env:
          ENGINE: ${{ inputs.engine == 'glue' && 'glue' || 'emr' }}
        run: uv run --with boto3 python tests/aws/teardown.py

      - name: Upload reports
        if: always() && !inputs.dry-run
        uses: actions/upload-artifact@v7
        with:
          name: aws-${{ inputs.engine }}-platform-test-report
          path: test-reports/
          if-no-files-found: warn
